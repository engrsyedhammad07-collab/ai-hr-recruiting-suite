services:
  - type: web
    name: ai-hr-recruiting-backend
    env: python
    region: frankfurt # Or whichever region you prefer
    plan: free
    rootDir: python code
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hr_ai_agent:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9